<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Marginalia">
  <!--
    THE MARK: a sheet of paper with one citation on it.

    A lit paper sheet on the dark room, a citrine band across the line that was
    cited, and a tick on the Evidence Rail down the right edge — the product in
    16 pixels. The one coloured element is the citation, which is the organizing
    law of the design system rather than a decorative accent.

    Fixed to the dark room and to the paper invariant, so it reads the same in a
    light tab bar as in a dark one. Colours are the hex source of truth from the
    design system; see globals.css for the OKLCH tokens they stand for.
  -->
  <rect width="32" height="32" rx="6" fill="#0F1316"/>
  <rect x="7" y="5.5" width="18" height="21" rx="1.5" fill="#FCFBF8" stroke="#E4E1D8" stroke-width="0.5"/>
  <!-- Lines of document text. -->
  <rect x="10" y="9.5" width="9" height="1.5" rx="0.75" fill="#5A5F63"/>
  <rect x="10" y="16" width="10" height="1.5" rx="0.75" fill="#16181A" opacity="0.55"/>
  <rect x="10" y="19.5" width="7" height="1.5" rx="0.75" fill="#16181A" opacity="0.55"/>
  <!-- The citation: a 26% band with a full-strength underline. -->
  <rect x="10" y="12" width="12" height="2.6" fill="#E8C15A" opacity="0.26"/>
  <rect x="10" y="14.1" width="12" height="0.9" fill="#E8C15A"/>
  <!-- The Evidence Rail, with a mark at the cited line. -->
  <rect x="22.6" y="8" width="1.4" height="16" rx="0.7" fill="#E4E1D8"/>
  <rect x="22.6" y="12.2" width="1.4" height="1.6" rx="0.7" fill="#E8C15A"/>
</svg>
